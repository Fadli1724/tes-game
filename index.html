<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bermuda Drop 3D</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
#gl{position:fixed;inset:0;width:100%;height:100%}
.o{position:fixed;pointer-events:none}
.m,.pl,.pn,.dr,#lobby,#over{display:none!important}
[data-s=plane] .m,[data-s=drop] .m,[data-s=play] .m,[data-s=play] .pl,[data-s=plane] .pn,[data-s=drop] .dr,[data-s=lobby] #lobby,[data-s=over] #over{display:flex!important}
#mm{left:8px;top:8px;border:2px solid #000a;background:#4f7a3c}
#st{right:8px;top:8px;gap:4px;font-weight:800;font-size:15px}
#st span{padding:4px 12px;border-radius:2px}
#am{right:8px;top:44px;flex-direction:column;background:#0a1220b8;padding:6px 12px;min-width:130px}
#am b{font-size:26px}#am small{color:#ffd23f}
#hpw{left:50%;bottom:10px;width:min(300px,38vw);transform:translateX(-50%);height:8px;background:#0008}
#hpb{display:block;height:100%;width:100%;background:#fff}
#hpt{position:absolute;right:calc(100% + 8px);top:-5px;font-size:12px;white-space:nowrap}
#x{left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid #fff9;border-radius:50%}
#tt{left:50%;top:16%;transform:translateX(-50%);font-weight:800;font-size:17px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .3s;text-align:center}
#fl{inset:0;background:#f00;opacity:0;transition:opacity .15s}
#jb{display:none;width:110px;height:110px;border-radius:50%;border:2px solid #fff8;background:#fff2}
#jk{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffa}
.b{position:fixed;border-radius:50%;background:#ffffff2b;border:2px solid #ffffffb8;align-items:center;justify-content:center;font-weight:800;pointer-events:auto;touch-action:none;font-size:22px}
#fire{right:22px;bottom:20px;width:92px;height:92px;font-size:34px}
#rel{right:130px;bottom:18px;width:54px;height:54px}
#jmp{right:30px;bottom:126px;width:60px;height:60px}
#crc{right:104px;bottom:116px;width:52px;height:52px}
#scp{right:30px;bottom:196px;width:52px;height:52px}
#lmp,#trn{left:50%;bottom:22%;width:92px;height:92px;margin-left:-46px;background:#ffd23f;color:#2a1a00;font-size:16px;border-color:#fff}
#lobby{inset:0;position:fixed;flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(#0003,#0000 30%,#0000 70%,#0004);padding:14px 20px}
#lobby h1{margin:0;font-size:clamp(26px,6vw,46px);letter-spacing:1px;text-shadow:0 3px 8px #0008}
#lobby p{margin:2px 0 0;text-shadow:0 2px 4px #000}
#rk{position:fixed;right:16px;bottom:108px;width:270px;background:#0a1220c8;padding:8px 14px;font-size:14px;color:#ddd}#rk b{color:#4cc3ff;font-size:20px}
#go{pointer-events:auto;position:fixed;right:16px;bottom:16px;width:270px;height:84px;border:0;background:linear-gradient(#ffd23f,#ff9a1f);font:900 38px "Trebuchet MS",sans-serif;color:#2a1a00}
#hint{text-shadow:0 2px 4px #000;font-size:13px}
#over{position:fixed;inset:0;background:#050a14d0;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#over h2{margin:0;font-size:clamp(34px,8vw,60px)}
</style>
</head>
<body data-s="lobby">
<canvas id="gl"></canvas>
<canvas id="mm" class="o m" width="120" height="120"></canvas>
<div id="st" class="o m"><span id="al" style="background:#1ea5b5"></span><span id="kl" style="background:#b32127"></span></div>
<div id="am" class="o pl"><b id="mg"></b><small id="rt"></small></div>
<div id="hpw" class="o m"><i id="hpb"></i><span id="hpt"></span></div>
<div id="x" class="o pl"></div>
<div id="tt" class="o"></div><div id="fl" class="o"></div>
<div id="jb" class="o"><div id="jk"></div></div>
<div class="b pl" id="fire">🔫</div><div class="b pl" id="rel">↻</div><div class="b pl" id="jmp">▲</div><div class="b pl" id="crc">▼</div><div class="b pl" id="scp">◎</div>
<div class="b pn" id="lmp">LOMPAT</div><div class="b dr" id="trn">TURUN</div>
<div id="lobby"><div><h1>BERMUDA DROP 3D</h1><p>40 pemain · 1 pemenang</p></div><div id="hint"></div><div id="rk"><b>BR-RANKED</b><br>Bermuda · Kill terbaik: <span id="bs">0</span></div><button id="go">Mulai</button></div>
<div id="over"><h2 id="ot"></h2><div id="os" style="font-size:20px"></div><div style="color:#bbb">Ketuk layar untuk kembali ke lobi</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.body.innerHTML='<p style="padding:30px">Gagal memuat Three.js. Cek koneksi internet lalu muat ulang.</p>';throw 0}
const $=id=>document.getElementById(id),V3=THREE.Vector3,R=Math.random,HW=400,CL=(v,a,b)=>Math.max(a,Math.min(b,v));
const rd=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x8ec9ff);sc.fog=new THREE.Fog(0x9fd2ff,90,380);
const cam=new THREE.PerspectiveCamera(65,1,.1,700);
function rs(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
sc.add(new THREE.HemisphereLight(0xffffff,0x6f8a55,.95));
const sun=new THREE.DirectionalLight(0xfff2d0,.8);sun.position.set(120,200,80);sc.add(sun);
const mat=c=>new THREE.MeshLambertMaterial({color:c}),box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));

/* dunia */
const gr=new THREE.Mesh(new THREE.PlaneGeometry(HW*2,HW*2),mat(0x6f9552));gr.rotation.x=-Math.PI/2;sc.add(gr);
const sea=new THREE.Mesh(new THREE.PlaneGeometry(3000,3000),mat(0x2b78b0));sea.rotation.x=-Math.PI/2;sea.position.y=-.4;sc.add(sea);
const blds=[],solids=[],wc=[0xb4573b,0xc9b79c,0x7d8c99,0xd9a066];
for(let i=0;i<44;i++){const w=10+R()*10,d=10+R()*8,h=5+R()*5,x=(R()-.5)*(HW*2-60),z=(R()-.5)*(HW*2-60);if(Math.hypot(x,z)<16)continue;
  const m=box(w,h,d,wc[i%4]);m.position.set(x,h/2,z);const r=box(w+1.2,.6,d+1.2,0x7a3b2b);r.position.set(x,h+.3,z);sc.add(m,r);solids.push(m,r);blds.push({x,z,w,d})}
const tg=new THREE.CylinderGeometry(.3,.4,3,6),cg=new THREE.ConeGeometry(2,6,7),tmt=mat(0x5b3a22),cmt=mat(0x2f6b36);
for(let i=0;i<170;i++){const x=(R()-.5)*(HW*2-20),z=(R()-.5)*(HW*2-20);if(Math.hypot(x,z)<9)continue;const t=new THREE.Mesh(tg,tmt),c=new THREE.Mesh(cg,cmt);t.position.set(x,1.5,z);c.position.set(x,5.5,z);sc.add(t,c)}
const tw=new THREE.Mesh(new THREE.CylinderGeometry(1,3,60,6),mat(0x888f99));tw.position.set(40,30,-60);sc.add(tw);
const loot=[];for(let i=0;i<70;i++){const b=blds[i%blds.length],t=R()<.55?'a':'m',m=box(.7,.5,.7,t==='a'?0xffd23f:0x34d399);m.position.set(b.x+(R()-.5)*b.w,.4,b.z+b.d/2+2);sc.add(m);loot.push({m,t,dead:false})}
const zm=new THREE.Mesh(new THREE.CylinderGeometry(1,1,120,48,1,true),new THREE.MeshBasicMaterial({color:0xa24bff,transparent:true,opacity:.28,side:THREE.DoubleSide,fog:false}));zm.position.y=60;sc.add(zm);

function char(jc){const g=new THREE.Group(),p=[];const add=(w,h,d,c,x,y,z)=>{const m=box(w,h,d,c);m.position.set(x,y,z);g.add(m);p.push(m)};
  add(.55,.9,.3,0x1b1b22,0,.45,0);add(.75,.8,.42,jc,0,1.3,0);add(.38,.38,.38,0xe8bf9b,0,1.9,0);add(.4,.14,.4,0x15151b,0,2.12,0);add(.12,.14,1,0x3b86ff,.38,1.35,-.5);return{g,p}}
const pc=char(0xc4262e);sc.add(pc.g);
const pln=new THREE.Group();{const f=box(2.5,2.5,14,0xb32127),w=box(18,.4,3,0x8a1a1f),t=box(5,.4,2,0x8a1a1f);t.position.z=6;pln.add(f,w,t);pln.scale.setScalar(1.4);sc.add(pln)}
const pch=new THREE.Mesh(new THREE.SphereGeometry(3.2,14,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshLambertMaterial({color:0x8a4bd8,side:THREE.DoubleSide}));sc.add(pch);

/* state */
let S='lobby',tm=0,alive=40,kills=0,best=0,yaw=0,pitch=.15,fireH=false,scope=false,ttm=0,nextDie=5;
try{best=+localStorage.getItem('brBest3d')||0}catch(e){}
const P={pos:new V3(),vy:0,hp:200,mag:30,res:90,rel:0,cd:0,crouch:false,dive:false,hit:0};
const plane={p:new V3(),d:new V3(),t:0,len:1},zone={x:0,z:0,r:520};
let bots=[],tr=[];
const touch=matchMedia('(pointer:coarse)').matches;
function setS(s){S=s;document.body.dataset.s=s}
function inB(x,z,m){return blds.some(b=>Math.abs(x-b.x)<b.w/2+m&&Math.abs(z-b.z)<b.d/2+m)}
function toast(s){const e=$('tt');e.textContent=s;e.style.opacity=1;ttm=2.2}
function init(){
  bots.forEach(b=>sc.remove(b.c.g));bots=[];
  for(let i=0;i<39;i++){const c=char([0x2a4d8f,0x444444,0x7a5c1e,0x2e6b4f][i%4]);let x,z;do{x=(R()-.5)*760;z=(R()-.5)*760}while(inB(x,z,3)||Math.hypot(x,z)<20);
    c.g.position.set(x,0,z);c.g.visible=false;sc.add(c.g);const b={c,hp:100,cd:R()*2,wx:x,wz:z,wt:0};c.p.forEach(m=>m.userData.b=b);bots.push(b)}
  loot.forEach(l=>{l.dead=false;l.m.visible=true});
  Object.assign(P,{hp:200,mag:30,res:90,rel:0,cd:0,crouch:false,dive:false,vy:0,hit:0});
  alive=40;kills=0;tm=0;nextDie=5;scope=false;
  zone.x=(R()-.5)*300;zone.z=(R()-.5)*300;zone.r=520;
  const a=R()*Math.PI*2,sx=-Math.cos(a)*470,sz=-Math.sin(a)*470;plane.p.set(sx,120,sz);plane.d.set(Math.cos(a),0,Math.sin(a)).normalize();plane.t=0;plane.len=940;
  best=best;$('bs').textContent=best;
}
init();
$('hint').textContent=touch?'Stik kiri: gerak · Geser layar kanan: arahkan kamera':'WASD gerak · Mouse arah · Klik tembak · Spasi lompat · C jongkok · R reload';
function start(){init();bots.forEach(b=>b.c.g.visible=true);yaw=Math.atan2(-plane.d.x,-plane.d.z);pitch=.1;setS('plane');toast('Tekan LOMPAT untuk terjun')}
function jump(){if(S!=='plane')return;P.pos.copy(plane.p);P.vy=0;setS('drop');toast('Geser untuk arah · TURUN untuk menukik')}
function rl(){if(P.rel>0||P.mag>=30||P.res<=0||S!=='play')return;P.rel=1.6}
function endG(w){if(kills>best){best=kills;try{localStorage.setItem('brBest3d',best)}catch(e){}}
  $('ot').textContent=w?'BOOYAH!':'Kamu tersingkir';$('ot').style.color=w?'#ffd23f':'#ff6b6b';$('os').textContent='Peringkat #'+(w?1:alive)+' · Kill: '+kills+' · Terbaik: '+best;setS('over');fireH=false}
function hurt(n){P.hp-=n;P.hit=.2;$('fl').style.opacity=.3;setTimeout(()=>$('fl').style.opacity=0,150)}
function col(p,r){for(const b of blds){const nx=CL(p.x,b.x-b.w/2,b.x+b.w/2),nz=CL(p.z,b.z-b.d/2,b.z+b.d/2),dx=p.x-nx,dz=p.z-nz,d=Math.hypot(dx,dz);if(d<r){if(d<1e-4){p.x+=r;continue}p.x+=dx/d*(r-d);p.z+=dz/d*(r-d)}}p.x=CL(p.x,-HW+3,HW-3);p.z=CL(p.z,-HW+3,HW-3)}
function tracer(a,b){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color:0xffe27a}));sc.add(l);tr.push({l,t:.07})}

/* input */
const keys={},lp={};let jid=null,ji={x:0,y:0},jo={x:0,y:0};const jb=$('jb'),jk=$('jk');
function btn(id,dn,upf){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();el.setPointerCapture(e.pointerId);dn(e)});if(upf){el.addEventListener('pointerup',upf);el.addEventListener('pointercancel',upf)}}
btn('fire',e=>{fireH=true;lp[e.pointerId]={x:e.clientX,y:e.clientY}},()=>fireH=false);
btn('rel',rl);btn('jmp',()=>{if(P.pos.y<=.01&&S==='play')P.vy=7.5});btn('crc',()=>P.crouch=!P.crouch);btn('scp',()=>scope=!scope);
btn('lmp',jump);btn('trn',()=>P.dive=!P.dive);
$('go').onclick=start;$('over').onclick=()=>{init();setS('lobby')};
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||S==='plane'||S==='lobby'||S==='over')return;
  if(e.clientX<innerWidth*.42&&jid===null){jid=e.pointerId;jo={x:e.clientX,y:e.clientY};ji={x:0,y:0};jb.style.cssText='display:block;left:'+(jo.x-55)+'px;top:'+(jo.y-55)+'px';jk.style.transform='none'}
  else lp[e.pointerId]={x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(e.pointerType==='mouse')return;
  if(e.pointerId===jid){let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const l=Math.hypot(dx,dy);if(l>50){dx*=50/l;dy*=50/l}ji={x:dx/50,y:-dy/50};jk.style.transform='translate('+dx+'px,'+dy+'px)'}
  else if(lp[e.pointerId]){const q=lp[e.pointerId];yaw-=(e.clientX-q.x)*.0055;pitch=CL(pitch-(e.clientY-q.y)*.004,-.5,.9);q.x=e.clientX;q.y=e.clientY}});
const upH=e=>{if(e.pointerId===jid){jid=null;ji={x:0,y:0};jb.style.display='none'}delete lp[e.pointerId]};
addEventListener('pointerup',upH);addEventListener('pointercancel',upH);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==='r')rl();if(k==='c')P.crouch=!P.crouch;if(k==='j')jump();if(k==='f')P.dive=!P.dive;if(k==='enter'&&S==='lobby')start()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('mousemove',e=>{if(document.pointerLockElement){yaw-=e.movementX*.0025;pitch=CL(pitch-e.movementY*.002,-.5,.9)}});
addEventListener('mousedown',e=>{if(S!=='play'&&S!=='drop')return;if(!document.pointerLockElement)$('gl').requestPointerLock&&$('gl').requestPointerLock();else if(e.button===0)fireH=true;else if(e.button===2)scope=!scope});
addEventListener('mouseup',e=>{if(e.button===0&&!touch)fireH=false});
addEventListener('contextmenu',e=>e.preventDefault());

/* tembak */
const ray=new THREE.Raycaster(),ctr=new THREE.Vector2(0,0);
function shoot(){P.mag--;P.cd=.11;ray.setFromCamera(ctr,cam);
  const tg=[];bots.forEach(b=>{if(b.hp>0)tg.push(...b.c.p)});const hs=ray.intersectObjects(tg.concat(solids),false);
  let end=ray.ray.at(120,new V3()),hb=null;if(hs.length){end=hs[0].point.clone();hb=hs[0].object.userData.b||null}
  if(!hb&&touch){let bd=.07;const dist=hs.length?hs[0].distance:120;for(const b of bots){if(b.hp<=0)continue;const c=b.c.g.position.clone();c.y+=1.2;const v=c.clone().sub(cam.position),L=v.length();
    if(L<dist&&L<70&&v.angleTo(ray.ray.direction)<bd){bd=v.angleTo(ray.ray.direction);hb=b;end=c}}}
  if(hb){hb.hp-=26;if(hb.hp<=0){hb.c.g.visible=false;kills++;alive--;toast('Eliminasi! Kill: '+kills)}}
  const f=ray.ray.direction,mz=P.pos.clone();mz.y+=1.4;mz.addScaledVector(f,.9);tracer(mz,end);
  pitch=Math.min(.9,pitch+.004);if(P.mag===0)rl()}

/* update */
function move(dt,spd){let ix=ji.x,iy=ji.y;if(keys.a||keys.arrowleft)ix-=1;if(keys.d||keys.arrowright)ix+=1;if(keys.w||keys.arrowup)iy+=1;if(keys.s||keys.arrowdown)iy-=1;
  const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
  P.pos.x+=(fx*iy+rx*ix)*spd*dt;P.pos.z+=(fz*iy+rz*ix)*spd*dt}
function camUpd(){const f=new V3(-Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)),r=new V3(Math.cos(yaw),0,-Math.sin(yaw));
  const t=P.pos.clone();t.y+=P.crouch?1.2:1.6;const d=scope?2.2:4.2;cam.position.copy(t).addScaledVector(f,-d).addScaledVector(r,scope?.5:.8);cam.position.y=Math.max(.4,cam.position.y);
  cam.lookAt(cam.position.clone().add(f));const fv=scope?38:65;cam.fov+=(fv-cam.fov)*.2;cam.updateProjectionMatrix()}
function update(dt){
  if(ttm>0){ttm-=dt;if(ttm<=0)$('tt').style.opacity=0}
  for(let i=tr.length-1;i>=0;i--){tr[i].t-=dt;if(tr[i].t<=0){sc.remove(tr[i].l);tr[i].l.geometry.dispose();tr.splice(i,1)}}
  zm.visible=S==='play'||S==='drop';pln.visible=S==='plane'||S==='drop';pch.visible=false;
  if(S==='lobby'){const t=performance.now()/1000;pc.g.position.set(0,0,0);pc.g.rotation.y=.5+Math.sin(t*.5)*.3;pc.g.scale.set(1,1,1);
    cam.position.set(1.4,1.5,4.4);cam.lookAt(0,1.2,0);cam.fov=55;cam.updateProjectionMatrix();bots.forEach(b=>b.c.g.visible=false);return}
  if(S==='plane'||S==='drop'){plane.t+=28*dt;plane.p.addScaledVector(plane.d,28*dt);pln.position.copy(plane.p);pln.rotation.y=Math.atan2(-plane.d.x,-plane.d.z)}
  if(S==='plane'){P.pos.copy(plane.p);if(plane.t>plane.len-40)jump();
    const f=plane.d;cam.position.set(plane.p.x-f.x*34,plane.p.y+14,plane.p.z-f.z*34);cam.lookAt(plane.p);cam.fov=65;cam.updateProjectionMatrix();pc.g.visible=false}
  if(S==='drop'){pc.g.visible=true;move(dt,P.dive?9:13);P.pos.y-=(P.dive?32:9)*dt;pch.visible=!P.dive&&P.pos.y>2;if(P.pos.y<=0){P.pos.y=0;P.vy=0;setS('play');tm=0;toast('Mendarat! Cari senjata dan bertahan')}}
  if(S==='play'){
    tm+=dt;move(dt,P.crouch?3.2:6.5);P.vy-=22*dt;P.pos.y+=P.vy*dt;if(P.pos.y<=0){P.pos.y=0;P.vy=0}
    if(keys[' ']&&P.pos.y<=.01)P.vy=7.5;
    col(P.pos,.5);P.cd-=dt;P.hit-=dt;
    if(P.rel>0){P.rel-=dt;if(P.rel<=0){const n=Math.min(30-P.mag,P.res);P.mag+=n;P.res-=n}}
    if(fireH&&P.rel<=0&&P.cd<=0&&P.mag>0)shoot();
    for(const l of loot){if(l.dead)continue;if(Math.hypot(l.m.position.x-P.pos.x,l.m.position.z-P.pos.z)<2){if(l.t==='a'){P.res+=40;toast('Dipakai Peluru +40')}else{if(P.hp>=200)continue;P.hp=Math.min(200,P.hp+50);toast('Dipakai Medkit +50 HP')}l.dead=true;l.m.visible=false}}
    zone.r=Math.max(30,520-tm*2.4);if(Math.hypot(P.pos.x-zone.x,P.pos.z-zone.z)>zone.r){P.hp-=4*dt;if(ttm<=0)toast('Keluar zona aman!')}
    for(const b of bots){if(b.hp<=0)continue;const p=b.c.g.position,dx=P.pos.x-p.x,dz=P.pos.z-p.z,d=Math.hypot(dx,dz);
      if(d<55){b.c.g.rotation.y=Math.atan2(-dx,-dz);if(d>16){p.x+=dx/d*3.2*dt;p.z+=dz/d*3.2*dt}
        b.cd-=dt;if(b.cd<=0){b.cd=.9+R();const a=p.clone();a.y=1.4;const z=P.pos.clone();z.y+=1.2;tracer(a,z);if(R()<.35)hurt(7)}}
      else{if(Math.hypot(p.x-zone.x,p.z-zone.z)>zone.r){b.wx=zone.x;b.wz=zone.z}else{b.wt-=dt;if(b.wt<=0){b.wx=p.x+(R()-.5)*80;b.wz=p.z+(R()-.5)*80;b.wt=3+R()*3}}
        const ax=b.wx-p.x,az=b.wz-p.z,l=Math.hypot(ax,az)||1;b.c.g.rotation.y=Math.atan2(-ax,-az);p.x+=ax/l*3*dt;p.z+=az/l*3*dt}
      col(p,.5)}
    nextDie-=dt;if(nextDie<=0&&alive>2){const c=bots.filter(b=>b.hp>0&&Math.hypot(b.c.g.position.x-P.pos.x,b.c.g.position.z-P.pos.z)>90);if(c.length){const b=c[(R()*c.length)|0];b.hp=0;b.c.g.visible=false;alive--}nextDie=3+R()*4}
    if(P.hp<=0)endG(false);else if(alive<=1)endG(true)}
  if(S==='drop'||S==='play'||S==='over'){pc.g.visible=true;pc.g.position.copy(P.pos);pc.g.rotation.y=yaw;pc.g.scale.set(1,P.crouch?.75:1,1);pch.position.set(P.pos.x,P.pos.y+3,P.pos.z);if(S!=='over')camUpd()}
  zm.position.x=zone.x;zm.position.z=zone.z;zm.scale.set(zone.r,1,zone.r);
  /* HUD */
  $('al').textContent='👤 '+alive;$('kl').textContent='☠ '+kills;$('mg').textContent=P.mag+'/'+P.res;$('rt').textContent=P.rel>0?'Reload':'Senapan';
  $('hpb').style.width=Math.max(0,P.hp/2)+'%';$('hpb').style.background=P.hp<70?'#ff4d4d':'#fff';$('hpt').textContent='HP '+Math.max(0,P.hp|0)+'/200';mini()}
const mg=$('mm').getContext('2d');
function mini(){const s=.5,c=mg;c.fillStyle='#4f7a3c';c.fillRect(0,0,120,120);c.save();c.translate(60,60);
  c.fillStyle='#b4573b';for(const b of blds)c.fillRect((b.x-b.w/2-P.pos.x)*s,(b.z-b.d/2-P.pos.z)*s,b.w*s,b.d*s);
  c.strokeStyle='#b66bff';c.lineWidth=2;c.beginPath();c.arc((zone.x-P.pos.x)*s,(zone.z-P.pos.z)*s,zone.r*s,0,7);c.stroke();
  c.rotate(Math.atan2(-Math.cos(yaw),-Math.sin(yaw)));c.fillStyle='#4cc3ff';c.strokeStyle='#fff';c.beginPath();c.moveTo(8,0);c.lineTo(-5,-5);c.lineTo(-5,5);c.closePath();c.fill();c.stroke();c.restore()}
let last=performance.now();
(function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);rd.render(sc,cam)})(last);
