<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bermuda Drop 3D Final</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
#gl{position:fixed;inset:0;width:100%;height:100%}
.o{position:fixed;pointer-events:none}
.m,.pl,.pn,.dr,#lobby,#over{display:none!important}
[data-s=plane] .m,[data-s=drop] .m,[data-s=play] .m,[data-s=play] .pl,[data-s=plane] .pn,[data-s=drop] .dr,[data-s=lobby] #lobby,[data-s=over] #over{display:flex!important}

/* HUD Utama */
#mm{left:8px;top:8px;border:2px solid #000a;background:#4f7a3c;cursor:pointer;pointer-events:auto;z-index:10}
#bagbtn{left:136px;top:8px;width:44px;height:44px;border:2px solid #000a;background:#d97706;border-radius:6px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:10}

/* Info Status di Tengah Atas */
#st{left:50%;top:8px;transform:translateX(-50%);gap:6px;font-weight:800;font-size:13px;flex-direction:row;align-items:center;text-shadow:1px 1px 2px #000}
#st span{padding:4px 10px;border-radius:4px;white-space:nowrap}

#am{right:8px;top:20px;flex-direction:column;background:#0a1220b8;padding:6px 12px;min-width:130px;border-radius:4px;border:1px solid #334155}
#am b{font-size:26px}#am small{color:#ffd23f}

/* HP & Crosshair */
#hpw{left:50%;bottom:10px;width:min(300px,38vw);transform:translateX(-50%);height:10px;background:#0008;border-radius:4px;border:1px solid #fff5}
#hpb{display:block;height:100%;width:100%;background:#22c55e;transition:width 0.2s}
#hpt{position:absolute;right:calc(100% + 8px);top:-4px;font-size:13px;font-weight:bold;white-space:nowrap;text-shadow:1px 1px 0 #000}
#x{left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid #fff9;border-radius:50%}
#tt{left:50%;top:20%;transform:translateX(-50%);font-weight:800;font-size:16px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .3s;text-align:center;background:#0008;padding:6px 16px;border-radius:20px}
#fl{inset:0;background:#f00;opacity:0;transition:opacity .15s}
#hitm{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path stroke="red" stroke-width="4" fill="none" d="M20,20 L40,40 M80,20 L60,40 M20,80 L40,60 M80,80 L60,60"/></svg>');opacity:0;transition:opacity .1s}

/* Overlay Scope - Area hitam luar bisa diklik untuk keluar scope, tapi tombol kontrol tetap bisa diklik */
#scope-overlay { display:none; position:fixed; inset:0; z-index:5; pointer-events:none; background: radial-gradient(circle at center, transparent 35%, #000 36%, #000 100%); }
#scope-click-area { position:absolute; inset:0; pointer-events:auto; z-index:4; }
#scope-crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:100%; height:100%; pointer-events:none; z-index:5; }
.scope-sniper { background-image: linear-gradient(to right, transparent 49.8%, #000 49.8%, #000 50.2%, transparent 50.2%), linear-gradient(to bottom, transparent 49.8%, #000 49.8%, #000 50.2%, transparent 50.2%); }
.scope-ar { background-image: radial-gradient(circle at center, transparent 2px, red 2px, red 4px, transparent 4px), linear-gradient(to right, transparent 49.9%, #333 49.9%, #333 50.1%, transparent 50.1%), linear-gradient(to bottom, transparent 49.9%, #333 49.9%, #333 50.1%, transparent 50.1%); }

/* Navigasi Penanda (Marker Arrow) */
#nav-arrow{left:50%;top:80px;transform:translateX(-50%);font-size:24px;color:#ffd23f;text-shadow:0 2px 4px #000;display:none;align-items:center;flex-direction:column}
#nav-dist{font-size:12px;font-weight:bold;margin-top:-5px}

/* Joystick & Controls */
#jb{display:none;width:110px;height:110px;border-radius:50%;border:2px solid #fff8;background:#fff2;z-index:6}
#jk{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffa}
.b{position:fixed;border-radius:50%;background:#ffffff2b;border:2px solid #ffffffb8;align-items:center;justify-content:center;font-weight:800;pointer-events:auto;touch-action:none;font-size:22px;z-index:10}
#fire{right:22px;bottom:20px;width:92px;height:92px;font-size:34px;background:#ef444466;border-color:#ef4444}
#rel{right:130px;bottom:18px;width:54px;height:54px}
#jmp{right:30px;bottom:126px;width:60px;height:60px}
#crc{right:104px;bottom:116px;width:52px;height:52px}
#spr{right:170px;bottom:116px;width:52px;height:52px;font-size:20px;background:#3b82f688}
#btn-grenade{right:30px;bottom:264px;width:52px;height:52px;font-size:24px;background:#10b98188}
#scp{right:30px;bottom:196px;width:52px;height:52px}
#use{right:200px;bottom:18px;width:64px;height:64px;font-size:12px;background:#3b82f688}
#sw{right:100px;bottom:184px;width:52px;height:52px}
#use.hid{display:none!important}
#lmp,#trn{left:50%;bottom:22%;width:100px;height:100px;margin-left:-50px;background:#ffd23f;color:#2a1a00;font-size:18px;border-color:#fff}

/* Modal Map & Bag */
.overlay{position:fixed;inset:0;background:#050a14cc;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
.overlay.active{display:flex}
.box{background:#111827;border:2px solid #374151;padding:20px;border-radius:12px;width:min(90vw,500px);max-height:85vh;overflow-y:auto;position:relative}
.box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #374151;padding-bottom:10px}
.box-header h3{margin:0;color:#ffd23f;font-size:22px}
.close-btn{background:#ef4444;color:#fff;border:none;padding:8px 16px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px;box-shadow:0 2px 4px #0006}
.close-btn:active{background:#dc2626}

.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv-item{background:#1f2937;padding:12px;border-radius:8px;border:1px solid #4b5563;display:flex;flex-direction:column;gap:8px}
.inv-item b{font-size:16px;color:#60a5fa}
.inv-item span{font-size:13px;color:#d1d5db}
.inv-btn{background:#2563eb;color:#fff;border:none;padding:8px;border-radius:6px;font-weight:bold;cursor:pointer}
.inv-btn:active{background:#1d4ed8}

#map-container{position:relative;width:min(95vw,600px);height:min(95vw,600px);background:#2f4f2f;border:3px solid #fff;border-radius:8px;box-shadow:0 4px 12px #000;pointer-events:auto}
#mapcanvas{width:100%;height:100%;display:block;border-radius:5px}

/* Lobi & Over */
#lobby{inset:0;position:fixed;flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(#0003,#0000 30%,#0000 70%,#0004);padding:14px 20px;z-index:20}
#lobby h1{margin:0;font-size:clamp(26px,6vw,46px);letter-spacing:1px;text-shadow:0 3px 8px #0008;color:#ffd23f}
#lobby p{margin:2px 0 0;text-shadow:0 2px 4px #000}
#rk{position:fixed;right:16px;bottom:108px;width:270px;background:#0a1220c8;padding:12px;font-size:14px;color:#ddd;border-radius:8px;border:1px solid #334155}
#rk b{color:#4cc3ff;font-size:20px}
#go{pointer-events:auto;position:fixed;right:16px;bottom:16px;width:270px;height:80px;border:0;background:linear-gradient(135deg,#ffd23f,#ff9a1f);font:900 32px "Trebuchet MS",sans-serif;color:#2a1a00;border-radius:12px;cursor:pointer}
#hint{text-shadow:0 2px 4px #000;font-size:14px;color:#94a3b8}
#over{position:fixed;inset:0;background:#050a14f0;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:20}
#over h2{margin:0;font-size:clamp(34px,8vw,60px)}
</style>
</head>
<body data-s="lobby">
<canvas id="gl"></canvas>
<canvas id="mm" class="o m" width="130" height="130" title="Peta"></canvas>
<div id="bagbtn" class="o pl" title="Tas">🎒</div>

<div id="st" class="o m">
  <span id="al" style="background:#1ea5b5">👤 60</span>
  <span id="kl" style="background:#b32127">☠ 0</span>
  <span id="zn" style="background:#7c3aed">ZONA 1</span>
</div>
<div id="am" class="o pl"><b id="mg"></b><small id="rt"></small></div>
<div id="hpw" class="o m"><i id="hpb"></i><span id="hpt"></span></div>
<div id="x" class="o pl"></div>
<div id="hitm" class="o"></div>
<div id="tt" class="o"></div><div id="fl" class="o"></div>

<!-- Overlay Scope dengan Area Klik Luar untuk Keluar Scope -->
<div id="scope-overlay">
  <div id="scope-click-area" onclick="scope=false"></div>
  <div id="scope-crosshair"></div>
</div>

<!-- Navigasi Penanda (Arrow) -->
<div id="nav-arrow" class="o pl">
  <div id="nav-icon">▼</div>
  <div id="nav-dist">0m</div>
</div>

<div id="jb" class="o"><div id="jk"></div></div>
<div class="b pl" id="fire">🔫</div><div class="b pl" id="rel">↻</div><div class="b pl" id="jmp">▲</div><div class="b pl" id="crc">▼</div><div class="b pl" id="spr" title="Lari Cepat">🏃</div><div class="b pl" id="btn-grenade" title="Equip Granat">💣</div><div class="b pl" id="scp">◎</div><div class="b pl hid" id="use">BUKA</div><div class="b pl" id="sw">⇄</div>
<div class="b pn" id="lmp">LOMPAT</div><div class="b dr" id="trn">TURUN</div>

<!-- OVERLAYS -->
<div id="bagui" class="overlay">
  <div class="box">
    <div class="box-header"><h3>🎒 Tas Penyimpanan</h3><button class="close-btn" onclick="toggleBag(false)">Tutup ✕</button></div>
    <div class="inv-grid" id="invList"></div>
  </div>
</div>

<div id="mapui" class="overlay" onclick="if(event.target.id==='mapui') toggleMap(false)">
  <div style="color:#fff;font-weight:bold;margin-bottom:12px;text-shadow:0 2px 4px #000;pointer-events:none;font-size:15px">Ketuk Peta untuk Tandai | Ketuk area luar untuk Tutup</div>
  <div id="map-container">
    <canvas id="mapcanvas" width="600" height="600"></canvas>
  </div>
</div>

<!-- MENUS -->
<div id="lobby">
  <div><h1>BERMUDA DROP 3D</h1><p>60 pemain · 1 pemenang · 13 Kota</p></div>
  <div id="hint"></div>
  <div id="rk"><b>BR-RANKED</b><br>Bermuda · Kill terbaik: <span id="bs">0</span></div>
  <button id="go">MULAI</button>
</div>
<div id="over"><h2 id="ot"></h2><div id="os" style="font-size:20px"></div><div style="color:#bbb;margin-top:20px">Ketuk layar untuk kembali ke lobi</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.body.innerHTML='<p style="padding:30px">Gagal memuat Three.js. Cek koneksi internet lalu muat ulang.</p>';throw 0}
const $=id=>document.getElementById(id),V3=THREE.Vector3,R=Math.random,HW=1200,CL=(v,a,b)=>Math.max(a,Math.min(b,v));
const rd=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x7bc8ff);sc.fog=new THREE.Fog(0x8fd2ff,100,650);
const cam=new THREE.PerspectiveCamera(65,1,.1,900);
function rs(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

sc.add(new THREE.HemisphereLight(0xffffff,0x556b40,1.0));
const sun=new THREE.DirectionalLight(0xfffae6,0.9);sun.position.set(250,350,200);sc.add(sun);
const MC={},mat=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c})),box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));

/* ================== AUDIO SYSTEM (WEB AUDIO API) ================== */
let actx = null;
function initAudio(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }

function playSound(type){
  if(!actx) return;
  try {
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.connect(gain); gain.connect(actx.destination);
    const now = actx.currentTime;

    if(type === 'gun'){
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    } else if(type === 'step'){
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(30, now + 0.08);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if(type === 'hit'){
      osc.type = 'square';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.2);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.start(now); osc.stop(now + 0.2);
    }
  } catch(e){}
}

/* ================== TERRAIN, WATER, ROADS ================== */
const WATER_LEVEL = -0.5;
function getRiverZ(x) { return Math.sin(x*0.003)*250 + 100; }

function getTerrainHeight(x,z){
  let baseH = 8 + Math.sin(x*0.005)*Math.cos(z*0.005)*15 + Math.sin(x*0.015)*5;
  if(baseH < 1.5) baseH = 1.5;
  
  let h = baseH;
  let rZ = getRiverZ(x);
  let rDist = Math.abs(z - rZ);
  
  if(rDist < 45) {
    h = WATER_LEVEL - 2.5;
  } else if (rDist < 80) {
    h = Math.min(h, WATER_LEVEL + (rDist-45)*0.3);
  }
  
  if (Math.abs(x) < 14 || Math.abs(z+200) < 14) h = Math.max(1.0, h*0.3); 
  return h;
}

const terrainGeo = new THREE.PlaneGeometry(HW*2, HW*2, 120, 120);
const pos = terrainGeo.attributes.position;
for(let i=0; i<pos.count; i++){
  const vx = pos.getX(i), vy = pos.getY(i);
  pos.setZ(i, getTerrainHeight(vx, vy));
}
terrainGeo.computeVertexNormals();
const gr = new THREE.Mesh(terrainGeo, mat(0x5a8a42));
gr.rotation.x = -Math.PI/2;
sc.add(gr);

const sea = new THREE.Mesh(new THREE.PlaneGeometry(HW*2.2,HW*2.2), new THREE.MeshLambertMaterial({color:0x1e88e5, transparent:true, opacity:0.85}));
sea.rotation.x = -Math.PI/2; sea.position.y = WATER_LEVEL; sc.add(sea);

const r1 = box(HW*2, 0.4, 28, 0x334155); r1.position.z = -200; sc.add(r1);
const r2 = box(28, 0.4, HW*2, 0x334155); sc.add(r2);
function fixRoads(rMesh){
  const px = rMesh.geometry.attributes.position;
  for(let i=0;i<px.count;i++){
    let wx = px.getX(i) + rMesh.position.x, wz = px.getZ(i) + rMesh.position.z;
    let th = getTerrainHeight(wx, wz);
    if(Math.abs(wz - getRiverZ(wx)) < 65) th = Math.max(th, 3.5);
    px.setY(i, th);
  }
}
fixRoads(r1); fixRoads(r2);

const solids = [gr], blds=[], walls=[], doors=[], loot=[], glassPanes=[], HH=3.6; 
function makeBridge(bx, bz){
  const b = box(30, 2.0, 130, 0x475569);
  b.position.set(bx, 2.5, bz); sc.add(b); solids.push(b);
  const p1 = box(2, 6, 130, 0x64748b); p1.position.set(bx-14, 5, bz); sc.add(p1); solids.push(p1);
  const p2 = box(2, 6, 130, 0x64748b); p2.position.set(bx+14, 5, bz); sc.add(p2); solids.push(p2);
}
makeBridge(0, getRiverZ(0)); 
makeBridge(-400, getRiverZ(-400));
makeBridge(500, getRiverZ(500));

/* ================== 13 CITIES & BUILDINGS ================== */
const CITIES = [
  {name:'Istana Bimasakti', x:0, z:-50, type:'castle'},
  {name:'Clock Tower', x:-350, z:-250, type:'town'},
  {name:'Pochinok', x:-250, z:350, type:'town'},
  {name:'Mill Outpost', x:400, z:300, type:'factory'},
  {name:'Peak Village', x:250, z:-400, type:'village'},
  {name:'Factory', x:150, z:200, type:'factory'},
  {name:'Mars Electric', x:-500, z:450, type:'factory'},
  {name:'Shipyard', x:500, z:-450, type:'town'},
  {name:'Katulistiwa', x:-550, z:-100, type:'village'},
  {name:'Cape Town', x:550, z:100, type:'town'},
  {name:'Sentosa', x:300, z:600, type:'village'},
  {name:'Observatory', x:-600, z:-450, type:'factory'},
  {name:'Graveyard', x:-150, z:600, type:'village'}
];

const wc=[0xd6c4aa,0xe5d09b,0xc4b3ad,0xb8c5bc,0x9ca3af], rc=[0x9a3a2b,0x4b5b6a,0x6b3b2b,0x1f2937];
const WK=['pistol','smg','ar','sniper','grenade'];
const WD={
  pistol:{n:'Pistol',mag:12,cd:.28,dmg:24,sp:.02,rl:1.2,am:24,c:0xcccccc,len:.5, t:'gun'},
  smg:{n:'SMG',mag:30,cd:.07,dmg:14,sp:.08,rl:1.5,am:60,c:0xff8a1f,len:.8, t:'gun'},
  ar:{n:'Assault Rifle',mag:30,cd:.11,dmg:22,sp:.04,rl:1.8,am:60,c:0x22c55e,len:1.1, t:'gun'},
  sniper:{n:'Sniper',mag:5,cd:.9,dmg:95,sp:0,rl:2.2,am:10,c:0x3b82f6,len:1.4, t:'gun'},
  grenade:{n:'Granat',mag:1,cd:1,dmg:100,sp:0,rl:0,am:1,c:0x10b981,len:.4, t:'throw'}
};

CITIES.forEach((city) => {
  const count = (city.type === 'castle') ? 1 : (12 + Math.floor(R()*8));
  for(let i=0; i<count; i++){
    let bx = city.x + (i===0 && city.type==='castle' ? 0 : (R()-.5)*220);
    let bz = city.z + (i===0 && city.type==='castle' ? 0 : (R()-.5)*220);
    
    const th = getTerrainHeight(bx, bz);
    if(th < WATER_LEVEL + 1 || Math.abs(bz - getRiverZ(bx)) < 60) continue;
    
    const isCastle = (city.type === 'castle' && i===0);
    const w = isCastle ? 40 : (8 + R()*12);
    const d = isCastle ? 40 : (8 + R()*12);
    const hgt = isCastle ? 12 : HH + (R()>0.7?2:0);
    
    if(blds.some(b => Math.abs(b.x-bx) < (b.w+w)/2+4 && Math.abs(b.z-bz) < (b.d+d)/2+4)) continue;

    const bObj = {x:bx, z:bz, w, d, sol:[]}; blds.push(bObj);
    const c = isCastle ? 0xe2e8f0 : wc[blds.length % 5], t=.4;
    const xl = bx-w/2, xr = bx+w/2, zb = bz-d/2, zf = bz+d/2;

    const wl = (x1, x2, z1, z2, isWindow) => {
      const mh = getTerrainHeight((x1+x2)/2, (z1+z2)/2);
      const m = box(x2-x1||t, hgt, z2-z1||t, c);
      m.position.set((x1+x2)/2, mh + hgt/2, (z1+z2)/2);
      sc.add(m); solids.push(m); bObj.sol.push(m); walls.push({x1,x2,z1,z2});
      
      if(isWindow && !isCastle && Math.abs(x2-x1) > 2.5 || Math.abs(z2-z1) > 2.5){
        const gm = new THREE.Mesh(new THREE.BoxGeometry(x2-x1||.2, 1.5, z2-z1||.2), new THREE.MeshLambertMaterial({color:0xa5f3fc, transparent:true, opacity:0.4}));
        gm.position.set((x1+x2)/2, mh + 2.0, (z1+z2)/2);
        sc.add(gm); solids.push(gm); bObj.sol.push(gm);
        glassPanes.push({m:gm, hp:25, dead:false});
      }
    };

    wl(xl,xr,zb,zb+t, true); wl(xl,xl+t,zb,zf, true); wl(xr-t,xr,zb,zf, true); wl(xl,bx-1,zf-t,zf, false); wl(bx+1,xr,zf-t,zf, false);
    
    const lt = box(2, .8, t, c); lt.position.set(bx, th+hgt-.4, zf-t/2); sc.add(lt); solids.push(lt); bObj.sol.push(lt);
    const fl = box(w, .1, d, 0x524333); fl.position.set(bx, th+.05, bz); sc.add(fl);
    const rf = box(w+1.2, .5, d+1.2, isCastle ? 0x1e293b : rc[blds.length%4]); rf.position.set(bx, th+hgt+.25, bz); sc.add(rf); solids.push(rf); bObj.roof=rf;

    const put = (k, isW, nearX=null, nearZ=null) => {
      const wd=WD[k], m = isW ? box(.2,.2,wd.len*.8,wd.c) : box(.45,.3,.45,wd.c);
      const px = nearX !== null ? nearX + (R()-.5)*1.5 : bx+(R()-.5)*(w-3);
      const pz = nearZ !== null ? nearZ + (R()-.5)*1.5 : bz+(R()-.5)*(d-3);
      m.position.set(px, getTerrainHeight(px,pz) + (isW?.7:.4), pz);

  }
  if(hb){ hb.hp -= w.dmg; if(hb.hp <= 0){hb.dt=1.2; kills++; alive--; toast('Eliminasi! Kill: '+kills)} }
  
  const f = ray.ray.direction, mz = P.pos.clone(); mz.y+=1.4; mz.addScaledVector(f,.9); tracer(mz,end);
  pitch = Math.min(.85, pitch+.004+w.dmg*.00005); if(h.mag===0) rl(); updateBagUI();
}

function throwGrenade(chargeTime){
  if(P.res.grenade <= 0) return;
  P.res.grenade--; updateBagUI();
  const force = Math.min(1.5, 0.5 + chargeTime * 0.8) * 35; 
  
  const gm = box(0.3, 0.3, 0.3, 0x10b981);
  const startPos = cam.position.clone().add(ray.ray.direction.clone().multiplyScalar(1.5));
  gm.position.copy(startPos); sc.add(gm);
  
  const dir = new V3(0,0,-1).applyQuaternion(cam.quaternion).normalize(); dir.y += 0.25;
  grenades.push({m: gm, p: startPos, v: dir.multiplyScalar(force), t: 2.0});
}

/* ================== UPDATE LOOP ================== */
function move(dt, spd){
  let ix=ji.x, iy=ji.y;
  if(keys.a||keys.arrowleft) ix-=1; if(keys.d||keys.arrowright) ix+=1; if(keys.w||keys.arrowup) iy+=1; if(keys.s||keys.arrowdown) iy-=1;
  const l = Math.hypot(ix,iy); if(l>1){ix/=l; iy/=l}
  if(l > 0.1){
    stepTimer -= dt;
    if(stepTimer <= 0){ playSound('step'); stepTimer = P.spr ? 0.35 : 0.5; }
  }
  const fx=-Math.sin(yaw), fz=-Math.cos(yaw), rx=Math.cos(yaw), rz=-Math.sin(yaw);
  P.pos.x += (fx*iy + rx*ix)*spd*dt; P.pos.z += (fz*iy + rz*ix)*spd*dt;
}

const cr = new THREE.Raycaster();
function camUpd(){
  const f=new V3(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch)), r=new V3(Math.cos(yaw),0,-Math.sin(yaw));
  const t = P.pos.clone(); t.y += P.crouch?1.2:(P.swm?0.5:1.6);
  
  if(scope){
    // TRUE FIRST PERSON POV DI KEPALA SAAT SCOPE + KONTROL TETAP MUNCUL
    cam.position.copy(t).add(new V3(0, 0.4, 0));
    pc.g.visible = false;
  } else {
    pc.g.visible = true;
    const d=4.2;
    cam.position.copy(t).addScaledVector(f,-d).addScaledVector(r,.8);
    
    const th = getTerrainHeight(cam.position.x, cam.position.z);
    if(cam.position.y < Math.max(th, WATER_LEVEL)+.5) cam.position.y = Math.max(th, WATER_LEVEL)+.5;
    
    const dir = cam.position.clone().sub(t), L = dir.length(); cr.set(t, dir.normalize()); cr.far = L;
    const hh = cr.intersectObjects(solids, false);
    if(hh.length) cam.position.copy(t).addScaledVector(dir, Math.max(0.4, hh[0].distance - 0.4));
  }
  
  cam.lookAt(cam.position.clone().add(f));
  const fv = scope?(P.cur==='sniper'?18:32):(P.spr?75:65); cam.fov+=(fv-cam.fov)*.2; cam.updateProjectionMatrix();
  
  if(scope && P.cur && WD[P.cur].t === 'gun') {
      $('scope-overlay').style.display = 'block';
      $('scope-crosshair').className = P.cur === 'sniper' ? 'scope-sniper' : 'scope-ar';
      $('x').style.display = 'none';
  } else {
      $('scope-overlay').style.display = 'none';
      $('x').style.display = 'block';
  }
}

function update(dt){
  if(ttm>0){ttm-=dt; if(ttm<=0)$('tt').style.opacity=0}
  for(let i=tr.length-1; i>=0; i--){tr[i].t-=dt; if(tr[i].t<=0){sc.remove(tr[i].l); tr[i].l.geometry.dispose(); tr.splice(i,1)}}
  for(const d of doors){d.a+=((d.o?1:0)-d.a)*Math.min(1, dt*8); d.pv.rotation.y=-d.a*1.6}
  
  zm.visible = S==='play'||S==='drop'; pln.visible = S==='plane'||S==='drop'; pch.visible=false;

  if(S==='lobby'){
    const t=performance.now()/1000; pc.g.position.set(0, getTerrainHeight(0,0), 0); pc.g.rotation.y=.5+Math.sin(t*.5)*.3; pc.g.scale.set(1,1,1); anim(pc,0,dt,false,false,false);
    cam.position.set(2, getTerrainHeight(0,0)+2, 5); cam.lookAt(0, getTerrainHeight(0,0)+1.2, 0); cam.fov=55; cam.updateProjectionMatrix(); bots.forEach(b=>b.c.g.visible=false); return;
  }

  if(S==='plane'||S==='drop'){plane.t+=65*dt; plane.p.addScaledVector(plane.d, 65*dt); pln.position.copy(plane.p); pln.rotation.y=Math.atan2(-plane.d.x,-plane.d.z)}
  
  if(S==='plane'){
    P.pos.copy(plane.p); if(plane.t > plane.len-60) jump();
    const f = plane.d; cam.position.set(plane.p.x-f.x*36, plane.p.y+15, plane.p.z-f.z*36); cam.lookAt(plane.p); cam.fov=65; cam.updateProjectionMatrix(); pc.g.visible=false;
  }
  
  if(S==='drop'){
    pc.g.visible=true; move(dt, P.dive?15:20); P.pos.y -= (P.dive?45:15)*dt;
    const th = Math.max(getTerrainHeight(P.pos.x, P.pos.z), WATER_LEVEL); pch.visible = !P.dive && P.pos.y > th+3;
    if(P.pos.y <= th){P.pos.y=th; P.vy=0; setS('play'); tm=0; toast('Mendarat! Cepat cari senjata & tas')}
  }

  if(S==='play'){
    tm+=dt; const px=P.pos.x, pz=P.pos.z;
    
    let onBridge = (Math.abs(P.pos.z - getRiverZ(P.pos.x)) < 15 && (Math.abs(P.pos.x)<15 || Math.abs(P.pos.x+400)<15 || Math.abs(P.pos.x-500)<15) && P.pos.y > 2.5);
    let th = getTerrainHeight(P.pos.x, P.pos.z);
    P.swm = (th <= WATER_LEVEL && P.pos.y <= WATER_LEVEL + 0.2 && !onBridge);
    
    let currentSpeed = P.swm ? 4.0 : (P.crouch ? 4.5 : (P.spr ? 17.5 : 9.5));
    move(dt, currentSpeed);
    
    if(!P.swm){ P.vy -= 24*dt; } else { P.vy -= 5*dt; if(P.pos.y < WATER_LEVEL-0.5) P.vy += 10*dt; }
    P.pos.y += P.vy*dt;
    
    if(!onBridge && P.pos.y <= th){P.pos.y=th; P.vy=0}
    if(onBridge && P.pos.y <= 4.0){P.pos.y=4.0; P.vy=0}
    
    col(P.pos, .5); P.sp = Math.hypot(P.pos.x-px, P.pos.z-pz)/dt; P.cd-=dt; P.hit-=dt; P.kick=Math.max(0, P.kick-dt*8);

    const w=cw();
    if(w && w.t==='gun' && !P.swm && !P.spr){
      if(P.rel>0){P.rel-=dt; if(P.rel<=0){const h=P.has[P.cur], n=Math.min(w.mag-h.mag, P.res[P.cur]); h.mag+=n; P.res[P.cur]-=n; updateBagUI();}}
      if(fireH&&P.rel<=0&&P.cd<=0&&P.has[P.cur].mag>0) shoot();
    } else if (w && w.t==='throw' && fireH && !P.swm && !P.spr) { fireT += dt; }

    for(let i=grenades.length-1; i>=0; i--){
      const g = grenades[i]; g.t -= dt; g.v.y -= 15*dt; g.p.addScaledVector(g.v, dt);
      const gth = getTerrainHeight(g.p.x, g.p.z);
      if(g.p.y <= gth){ g.p.y=gth; g.v.y *= -0.5; g.v.x *= 0.5; g.v.z *= 0.5; }
      g.m.position.copy(g.p);
      if(g.t <= 0){
        const exp = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 16), new THREE.MeshBasicMaterial({color:0xffaa00, transparent:true, opacity:0.8}));
        exp.position.copy(g.p); sc.add(exp); setTimeout(()=>{sc.remove(exp); exp.geometry.dispose()}, 250);
        const dmgRad = 10; if(Math.hypot(P.pos.x-g.p.x, P.pos.z-g.p.z) < dmgRad) hurt(65);
        bots.forEach(b=>{if(b.hp>0 && Math.hypot(b.c.g.position.x-g.p.x, b.c.g.position.z-g.p.z) < dmgRad) b.hp -= 100;});
        sc.remove(g.m); g.m.geometry.dispose(); grenades.splice(i,1);
      }
    }

    for(const l of loot){
      if(l.dead || Math.hypot(l.m.position.x-P.pos.x, l.m.position.z-P.pos.z)>1.8) continue;
      if(l.t==='w'){
        const isNew = !P.has[l.k]; P.has[l.k] = {mag:WD[l.k].mag}; toast('Dapat: '+WD[l.k].n);
        if(WD[l.k].t === 'throw') P.res[l.k]++; if(!P.cur || isNew) eq(l.k);
      } else if(l.t==='a'){ P.res[l.k]+=WD[l.k].am; toast('Amunisi '+WD[l.k].n+' +'+WD[l.k].am);
      } else { P.res.medkit++; toast('Medkit tersimpan! (+1)'); }
      l.dead=true; l.m.visible=false; updateBagUI();
    }

    let dn=null, dq=2.8; for(const d of doors){const q=Math.hypot(d.x-P.pos.x, d.z-P.pos.z); if(q<dq){dq=q; dn=d}} P.dn=dn; $('use').classList.toggle('hid',!dn); if(dn)$('use').textContent=dn.o?'TUTUP':'BUKA';

    zone.cd -= dt;
    if(zone.cd <= 0 && zone.stage < 5){ zone.stage++; zone.targetR = Math.max(80, zone.r - 250); zone.cd = 120; toast('Zona Tahap '+zone.stage+' Menyusut!'); }
    if(zone.r > zone.targetR) zone.r = Math.max(zone.targetR, zone.r - 12*dt);
    if(Math.hypot(P.pos.x-zone.x, P.pos.z-zone.z) > zone.r){ hurt((zoneDamages[zone.stage] || 10) * dt); if(ttm<=0) toast('Di luar Zona Aman!'); }

    for(const b of bots){
      const p=b.c.g.position;
      if(b.hp<=0){if(b.dt>0){b.dt-=dt; b.c.g.rotation.x=Math.max(0,Math.min(1.5,(1.2-b.dt)*4)); if(b.dt<=0)b.c.g.visible=false}continue}
      
      const dx=P.pos.x-p.x, dz=P.pos.z-p.z, d=Math.hypot(dx,dz); let sp=0;
      let bTh = getTerrainHeight(p.x, p.z); let bSwim = false;
      if(bTh <= WATER_LEVEL){ bTh = WATER_LEVEL; bSwim = true; } p.y = bTh;

      if(d<110 && !bSwim){
        b.c.g.rotation.y = Math.atan2(-dx,-dz);
        if(d>18){p.x+=dx/d*4.5*dt; p.z+=dz/d*4.5*dt; sp=4.5}
        b.cd-=dt; if(b.cd<=0){
          b.cd=1.2+R(); const a=p.clone(); a.y+=1.4; const z=P.pos.clone(); z.y+=1.2;
          ray.set(a, z.clone().sub(a).normalize()); const obs = ray.intersectObjects(solids, false);
          if(!obs.length || obs[0].distance > d){ tracer(a,z); if(R()<.35)hurt(10); }
        }
      } else {
        if(Math.hypot(p.x-zone.x, p.z-zone.z) > zone.r){b.wx=zone.x; b.wz=zone.z}
        else{ b.wt-=dt; if(b.wt<=0){ if(R() < 0.4) { b.wx = P.pos.x + (R() - 0.5) * 50; b.wz = P.pos.z + (R() - 0.5) * 50; } else { b.wx=p.x+(R()-.5)*120; b.wz=p.z+(R()-.5)*120; } b.wt=4+R()*4 } }
        const ax=b.wx-p.x, az=b.wz-p.z, l=Math.hypot(ax,az)||1;
        b.c.g.rotation.y = Math.atan2(-ax,-az); p.x+=ax/l*(bSwim?2.0:4.0)*dt; p.z+=az/l*(bSwim?2.0:4.0)*dt; sp=(bSwim?2.0:4.0);
      }
      col(p, .5); anim(b.c, sp*1.6, dt, d<110 && !bSwim, false, bSwim);
    }

    nextDie-=dt; if(nextDie<=0 && alive>2){
      const c = bots.filter(b=>b.hp>0 && Math.hypot(b.c.g.position.x-P.pos.x, b.c.g.position.z-P.pos.z)>180);
      if(c.length){const b = c[(R()*c.length)|0]; b.hp=0; b.c.g.visible=false; alive--} nextDie = 4+R()*5;
    }

    if(P.hp<=0) endG(false); else if(alive<=1) endG(true);
  }

  if(S==='drop'||S==='play'||S==='over'){
    const g=pc.g;
    if(!scope) {
      g.visible=true; g.position.copy(P.pos); g.rotation.y=yaw; g.rotation.x = S==='drop'&&P.dive?-1.2:0; g.scale.set(1, P.crouch?.75:1, 1);
    }
    
    if(S==='drop'){anim(pc,0,dt,false,false,false); pc.AL.rotation.z=-1.5; pc.AR.rotation.z=1.5; pc.AL.rotation.x=pc.AR.rotation.x=0; pc.L.rotation.x=.3; pc.R.rotation.x=-.3}
    else if(!scope) anim(pc, P.sp, dt, !!P.cur && !P.swm && !P.spr, P.pos.y > Math.max(getTerrainHeight(P.pos.x, P.pos.z), WATER_LEVEL)+.1, P.swm);

    pc.gun.visible = (!scope && !!P.cur && WD[P.cur].t==='gun' && !P.swm && !P.spr);
    pc.gun.position.z = -.25 - (P.cur && WD[P.cur].t==='gun'?WD[P.cur].len*.4:.5) + P.kick*.2;
    pch.position.set(P.pos.x, P.pos.y+3.5, P.pos.z);
    
    if(S!=='over') camUpd();
    
    const arr = $('nav-arrow');
    if(mapMarker && S==='play'){
      arr.style.display='flex';
      const mx = mapMarker.x - P.pos.x, mz = mapMarker.z - P.pos.z; const dist = Math.hypot(mx, mz);
      $('nav-dist').textContent = Math.round(dist) + 'm';
      let diff = Math.atan2(mx, -mz) - yaw;
      while(diff <= -Math.PI) diff += Math.PI*2; while(diff > Math.PI) diff -= Math.PI*2;
      const px = Math.sin(diff) * 120;
      $('nav-icon').style.transform = `translateX(${px}px) rotate(${diff}rad)`; $('nav-dist').style.transform = `translateX(${px}px)`;
    } else { arr.style.display='none'; }
  }

  zm.position.x=zone.x; zm.position.z=zone.z; zm.scale.set(zone.r,1,zone.r);

  $('al').textContent='👤 '+alive; $('kl').textContent='☠ '+kills; $('zn').textContent = `ZONA ${zone.stage}`;
  const w=cw();
  if(w){
    if(w.t === 'throw') $('mg').textContent = P.res[P.cur]; else $('mg').textContent = P.has[P.cur].mag+'/'+P.res[P.cur];
    $('rt').textContent = (P.rel>0?'Reload':w.n);
  } else { $('mg').textContent = '—'; $('rt').textContent = P.swm ? 'Berenang' : (P.spr ? 'Lari Cepat' : 'Tangan Kosong'); }
  
  $('hpb').style.width = Math.max(0, P.hp/2)+'%'; $('hpb').style.background = P.hp<70?'#ef4444':'#22c55e'; $('hpt').textContent = 'HP '+Math.max(0, P.hp|0)+'/200';
  mini();
}

const mg = $('mm').getContext('2d');
function mini(){
  const s=.25, c=mg; c.fillStyle='#4f7a3c'; c.fillRect(0,0,130,130); c.save(); c.translate(65,65);
  c.fillStyle='#1e88e5'; c.beginPath();
  for(let i=-65; i<=65; i+=5){ let wx = P.pos.x + i/s; c.lineTo(i, (getRiverZ(wx)-P.pos.z)*s - 45*s); }
  for(let i=65; i>=-65; i-=5){ let wx = P.pos.x + i/s; c.lineTo(i, (getRiverZ(wx)-P.pos.z)*s + 45*s); }
  c.fill();
  c.fillStyle='#334155'; c.fillRect(-65, (-200-P.pos.z)*s - 14*s, 130, 28*s); c.fillRect((0-P.pos.x)*s - 14*s, -65, 28*s, 130);
  
  c.fillStyle='#8c6d53'; for(const b of blds) c.fillRect((b.x-b.w/2-P.pos.x)*s, (b.z-b.d/2-P.pos.z)*s, b.w*s, b.d*s);
  c.strokeStyle='#a855f7'; c.lineWidth=2; c.beginPath(); c.arc((zone.x-P.pos.x)*s, (zone.z-P.pos.z)*s, zone.r*s, 0, 7); c.stroke();
  if(mapMarker){ c.fillStyle='#ef4444'; c.beginPath(); c.arc((mapMarker.x-P.pos.x)*s, (mapMarker.z-P.pos.z)*s, 4, 0, 7); c.fill(); }
  c.rotate(Math.atan2(-Math.cos(yaw),-Math.sin(yaw))); c.fillStyle='#38bdf8'; c.strokeStyle='#fff'; c.beginPath(); c.moveTo(8,0); c.lineTo(-5,-5); c.lineTo(-5,5); c.closePath(); c.fill(); c.stroke(); c.restore();
}

let last = performance.now();
(function loop(n){
  requestAnimationFrame(loop); const dt = Math.min(.05, (n-last)/1000); last=n; update(dt); rd.render(sc, cam);
})(last);
</script>
