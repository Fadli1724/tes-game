<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bermuda Drop 3D Complete</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1220;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS",Verdana,sans-serif;color:#fff}
#gl{position:fixed;inset:0;width:100%;height:100%}
.o{position:fixed;pointer-events:none}
.m,.pl,.pn,.dr,#lobby,#over{display:none!important}
[data-s=plane] .m,[data-s=drop] .m,[data-s=play] .m,[data-s=play] .pl,[data-s=plane] .pn,[data-s=drop] .dr,[data-s=lobby] #lobby,[data-s=over] #over{display:flex!important}

/* HUD Utama */
#mm{left:8px;top:8px;border:2px solid #000a;background:#4f7a3c;cursor:pointer;pointer-events:auto;z-index:10}
#bagbtn{left:136px;top:8px;width:44px;height:44px;border:2px solid #000a;background:#d97706;border-radius:6px;cursor:pointer;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:10}
#st{right:8px;top:8px;gap:4px;font-weight:800;font-size:15px;flex-direction:column;align-items:flex-end}
#st span{padding:4px 12px;border-radius:2px;margin-bottom:4px}
#am{right:8px;top:80px;flex-direction:column;background:#0a1220b8;padding:6px 12px;min-width:130px;border-radius:4px}
#am b{font-size:26px}#am small{color:#ffd23f}

/* HP & Crosshair */
#hpw{left:50%;bottom:10px;width:min(300px,38vw);transform:translateX(-50%);height:10px;background:#0008;border-radius:4px;border:1px solid #fff5}
#hpb{display:block;height:100%;width:100%;background:#22c55e;transition:width 0.2s}
#hpt{position:absolute;right:calc(100% + 8px);top:-4px;font-size:13px;font-weight:bold;white-space:nowrap;text-shadow:1px 1px 0 #000}
#x{left:50%;top:50%;width:22px;height:22px;margin:-11px;border:2px solid #fff9;border-radius:50%}
#tt{left:50%;top:20%;transform:translateX(-50%);font-weight:800;font-size:16px;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .3s;text-align:center;background:#0008;padding:6px 16px;border-radius:20px}
#fl{inset:0;background:#f00;opacity:0;transition:opacity .15s}

/* Joystick & Controls */
#jb{display:none;width:110px;height:110px;border-radius:50%;border:2px solid #fff8;background:#fff2;z-index:5}
#jk{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:#fffa}
.b{position:fixed;border-radius:50%;background:#ffffff2b;border:2px solid #ffffffb8;align-items:center;justify-content:center;font-weight:800;pointer-events:auto;touch-action:none;font-size:22px;z-index:10}
#fire{right:22px;bottom:20px;width:92px;height:92px;font-size:34px;background:#ef444466;border-color:#ef4444}
#rel{right:130px;bottom:18px;width:54px;height:54px}
#jmp{right:30px;bottom:126px;width:60px;height:60px}
#crc{right:104px;bottom:116px;width:52px;height:52px}
#scp{right:30px;bottom:196px;width:52px;height:52px}
#use{right:200px;bottom:84px;width:64px;height:64px;font-size:12px;background:#3b82f688}
#sw{right:176px;bottom:178px;width:52px;height:52px}
#use.hid{display:none!important}
#lmp,#trn{left:50%;bottom:22%;width:100px;height:100px;margin-left:-50px;background:#ffd23f;color:#2a1a00;font-size:18px;border-color:#fff}

/* Modal Map & Bag */
.overlay{position:fixed;inset:0;background:#050a14e6;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto}
.overlay.active{display:flex}
.box{background:#111827;border:2px solid #374151;padding:20px;border-radius:12px;width:min(90vw,500px);max-height:85vh;overflow-y:auto}
.box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;border-bottom:1px solid #374151;padding-bottom:10px}
.box-header h3{margin:0;color:#ffd23f;font-size:22px}
.close-btn{background:transparent;border:none;color:#fff;font-size:28px;cursor:pointer}
.inv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.inv-item{background:#1f2937;padding:12px;border-radius:8px;border:1px solid #4b5563;display:flex;flex-direction:column;gap:8px}
.inv-item b{font-size:16px;color:#60a5fa}
.inv-item span{font-size:13px;color:#d1d5db}
.inv-btn{background:#2563eb;color:#fff;border:none;padding:8px;border-radius:6px;font-weight:bold;cursor:pointer}
.inv-btn:active{background:#1d4ed8}

#mapcanvas{background:#2f4f2f;border:3px solid #fff;border-radius:8px;box-shadow:0 4px 12px #000}

/* Lobi & Over */
#lobby{inset:0;position:fixed;flex-direction:column;justify-content:space-between;pointer-events:none;background:linear-gradient(#0003,#0000 30%,#0000 70%,#0004);padding:14px 20px;z-index:20}
#lobby h1{margin:0;font-size:clamp(26px,6vw,46px);letter-spacing:1px;text-shadow:0 3px 8px #0008;color:#ffd23f}
#lobby p{margin:2px 0 0;text-shadow:0 2px 4px #000}
#rk{position:fixed;right:16px;bottom:108px;width:270px;background:#0a1220c8;padding:12px;font-size:14px;color:#ddd;border-radius:8px;border:1px solid #334155}
#rk b{color:#4cc3ff;font-size:20px}
#go{pointer-events:auto;position:fixed;right:16px;bottom:16px;width:270px;height:80px;border:0;background:linear-gradient(135deg,#ffd23f,#ff9a1f);font:900 32px "Trebuchet MS",sans-serif;color:#2a1a00;border-radius:12px;cursor:pointer}
#hint{text-shadow:0 2px 4px #000;font-size:14px;color:#94a3b8}
#over{position:fixed;inset:0;background:#050a14f0;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;z-index:20}
#over h2{margin:0;font-size:clamp(34px,8vw,60px)}
</style>
</head>
<body data-s="lobby">
<canvas id="gl"></canvas>
<canvas id="mm" class="o m" width="130" height="130" title="Peta"></canvas>
<div id="bagbtn" class="o pl" title="Tas">🎒</div>

<div id="st" class="o m">
  <span id="al" style="background:#1ea5b5"></span>
  <span id="kl" style="background:#b32127"></span>
  <span id="zn" style="background:#7c3aed">ZONA 1</span>
</div>
<div id="am" class="o pl"><b id="mg"></b><small id="rt"></small></div>
<div id="hpw" class="o m"><i id="hpb"></i><span id="hpt"></span></div>

<div id="jb" class="o"><div id="jk"></div></div>

<div class="b pn" id="lmp">LOMPAT</div><div class="b dr" id="trn">TURUN</div>

<!-- OVERLAYS -->
<div id="bagui" class="overlay">
  <div class="box">
    <div class="box-header"><h3>🎒 Tas Penyimpanan</h3><button class="close-btn" onclick="toggleBag(false)">×</button></div>
    <div class="inv-grid" id="invList"></div>
  </div>
</div>

  <div style="text-align:right;width:min(90vw,500px);margin-bottom:8px">
    <button class="close-btn" onclick="toggleMap(false)" style="font-size:18px;background:#374151;padding:4px 12px;border-radius:4px">Tutup Peta [M] ×</button>
  </div>
  <canvas id="mapcanvas" width="460" height="460"></canvas>
  <p style="color:#d1d5db;font-size:13px;margin-top:10px">Peta Bermuda. Titik kuning: Kota | Lingkaran ungu: Zona Aman</p>
</div>

<!-- MENUS -->
<div id="lobby">
  <div><h1>BERMUDA DROP 3D</h1><p>40 pemain · 1 pemenang</p></div>
  <div id="hint"></div>
  <div id="rk"><b>BR-RANKED</b><br>Bermuda · Kill terbaik: <span id="bs">0</span></div>
  <button id="go">MULAI</button>
</div>
<div id="over"><h2 id="ot"></h2><div id="os" style="font-size:20px"></div><div style="color:#bbb;margin-top:20px">Ketuk layar untuk kembali ke lobi</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(!window.THREE){document.body.innerHTML='<p style="padding:30px">Gagal memuat Three.js. Cek koneksi internet lalu muat ulang.</p>';throw 0}
const $=id=>document.getElementById(id),V3=THREE.Vector3,R=Math.random,HW=850,CL=(v,a,b)=>Math.max(a,Math.min(b,v));
const rd=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});rd.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
const sc=new THREE.Scene();sc.background=new THREE.Color(0x7bc8ff);sc.fog=new THREE.Fog(0x8fd2ff,100,450);
const cam=new THREE.PerspectiveCamera(65,1,.1,800);
function rs(){rd.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();

sc.add(new THREE.HemisphereLight(0xffffff,0x556b40,1.0));
const sun=new THREE.DirectionalLight(0xfffae6,0.9);sun.position.set(150,250,100);sc.add(sun);
const MC={},mat=c=>MC[c]||(MC[c]=new THREE.MeshLambertMaterial({color:c})),box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));

/* ================== TERRAIN & ROADS ================== */
// Fungsi untuk membuat kontur bukit (tidak datar)
function getTerrainHeight(x,z){
  let h = Math.sin(x*0.008)*Math.cos(z*0.008)*14 + Math.sin(x*0.02)*4;
  const dist = Math.hypot(x,z);
  if(dist < 150) h *= (dist/150); // Ratakan sedikit area tengah agar tidak terlalu curam
  // Jalan raya utama cross
  if(Math.abs(x) < 8 || Math.abs(z) < 8) h *= 0.1;
  return h;
}

const terrainGeo = new THREE.PlaneGeometry(HW*2, HW*2, 80, 80);
const pos = terrainGeo.attributes.position;
for(let i=0; i<pos.count; i++){
  const vx = pos.getX(i), vy = pos.getY(i);
  pos.setZ(i, getTerrainHeight(vx, vy));
}
terrainGeo.computeVertexNormals();
const gr = new THREE.Mesh(terrainGeo, mat(0x5a8a42));
gr.rotation.x = -Math.PI/2;
sc.add(gr);

const sea = new THREE.Mesh(new THREE.PlaneGeometry(3500,3500), mat(0x1e689e));
sea.rotation.x = -Math.PI/2; sea.position.y = -2; sc.add(sea);

// Jalan Raya (Asphalt)
const r1 = box(HW*2, 0.4, 16, 0x334155); r1.position.set(0, 0, 0); sc.add(r1);
const r2 = box(16, 0.4, HW*2, 0x334155); r2.position.set(0, 0, 0); sc.add(r2);
function fixRoads(){
  const px = r1.geometry.attributes.position;
  for(let i=0;i<px.count;i++){
    let wx=px.getX(i), wz=px.getZ(i); px.setY(i, getTerrainHeight(wx, wz));
  }
  const pz = r2.geometry.attributes.position;
  for(let i=0;i<pz.count;i++){
    let wx=pz.getX(i), wz=pz.getZ(i); pz.setY(i, getTerrainHeight(wx, wz));
  }
}
fixRoads();

/* ================== CITIES & BUILDINGS ================== */
const CITIES = [
  {name:'Istana Bimasakti', x:100, z:-100, type:'castle'},
  {name:'Clock Tower', x:-300, z:-250, type:'town'},
  {name:'Pochinok', x:-250, z:300, type:'town'},
  {name:'Mill Outpost', x:350, z:250, type:'factory'},
  {name:'Peak Village', x:200, z:-350, type:'village'}
];

const blds=[], solids=[], walls=[], doors=[], loot=[], glassPanes=[], HH=3.6;
const wc=[0xd6c4aa,0xe5d09b,0xc4b3ad,0xb8c5bc], rc=[0x9a3a2b,0x4b5b6a,0x6b3b2b];
const WK=['pistol','smg','ar','sniper'];
const WD={
  pistol:{n:'Pistol',mag:12,cd:.28,dmg:24,sp:.02,rl:1.2,am:24,c:0xcccccc,len:.5},
  smg:{n:'SMG',mag:30,cd:.07,dmg:14,sp:.08,rl:1.5,am:60,c:0xff8a1f,len:.8},
  ar:{n:'Assault Rifle',mag:30,cd:.11,dmg:22,sp:.04,rl:1.8,am:60,c:0x22c55e,len:1.1},
  sniper:{n:'Sniper',mag:5,cd:.9,dmg:95,sp:0,rl:2.2,am:10,c:0x3b82f6,len:1.4}
};

CITIES.forEach((city, ci) => {
  const count = (city.type === 'castle') ? 1 : 6;
  for(let i=0; i<count; i++){
    let bx = city.x + (i===0 && city.type==='castle' ? 0 : (R()-.5)*160);
    let bz = city.z + (i===0 && city.type==='castle' ? 0 : (R()-.5)*160);
    if(Math.abs(bx)<15) bx+=20; if(Math.abs(bz)<15) bz+=20; // hindari jalan
    const th = getTerrainHeight(bx, bz);
    
    const isCastle = (city.type === 'castle' && i===0);
    const w = isCastle ? 28 : (8 + R()*6);
    const d = isCastle ? 28 : (7 + R()*5);
    const hgt = isCastle ? 8 : HH;
    
    const bObj = {x:bx, z:bz, w, d, sol:[]}; blds.push(bObj);
    const c = isCastle ? 0xe2e8f0 : wc[blds.length % 4], t=.4;
    const xl = bx-w/2, xr = bx+w/2, zb = bz-d/2, zf = bz+d/2;

    const wl = (x1, x2, z1, z2, isWindow) => {
      const mh = getTerrainHeight((x1+x2)/2, (z1+z2)/2);
      const m = box(x2-x1||t, hgt, z2-z1||t, c);
      m.position.set((x1+x2)/2, mh + hgt/2, (z1+z2)/2);
      sc.add(m); solids.push(m); bObj.sol.push(m); walls.push({x1,x2,z1,z2});
      
      // Tambahkan Kaca Pecah Belah
      if(isWindow && !isCastle){
        const gm = new THREE.Mesh(new THREE.BoxGeometry(x2-x1||.2, 1.2, z2-z1||.2), new THREE.MeshLambertMaterial({color:0xa5f3fc, transparent:true, opacity:0.4}));
        gm.position.set((x1+x2)/2, mh + 1.6, (z1+z2)/2);
        sc.add(gm); solids.push(gm); bObj.sol.push(gm);
        glassPanes.push({m:gm, hp:25, dead:false});
      }
    };

    wl(xl,xr,zb,zb+t, true); wl(xl,xl+t,zb,zf, true); wl(xr-t,xr,zb,zf, true); wl(xl,bx-1,zf-t,zf, false); wl(bx+1,xr,zf-t,zf, false);
    
    const lt = box(2, .8, t, c); lt.position.set(bx, th+hgt-.4, zf-t/2); sc.add(lt); solids.push(lt); bObj.sol.push(lt);
    const fl = box(w, .1, d, 0x524333); fl.position.set(bx, th+.05, bz); sc.add(fl);
    const rf = box(w+1.2, .5, d+1.2, isCastle ? 0x334155 : rc[blds.length%3]); rf.position.set(bx, th+hgt+.25, bz); sc.add(rf); solids.push(rf); bObj.roof=rf;

    // Menara Kastil
    if(isCastle){
      [[-w/2,-d/2],[w/2,-d/2],[-w/2,d/2],[w/2,d/2]].forEach(([ox,oz])=>{
        const tm = box(4.5, 12, 4.5, 0x94a3b8);
        tm.position.set(bx+ox, th+6, bz+oz); sc.add(tm); solids.push(tm); bObj.sol.push(tm);
      });
    }

    // Pintu
    const pv = new THREE.Group(); pv.position.set(bx-1, th, zf-t/2);
    const dp = box(2, hgt-.8, .15, 0x4b3621); dp.position.set(1, (hgt-.8)/2, 0); pv.add(dp); sc.add(pv); solids.push(dp); bObj.sol.push(dp);
    const dr = {o:false, a:0, pv, x:bx, z:zf}; doors.push(dr); walls.push({x1:bx-1,x2:bx+1,z1:zf-t/2-.1,z2:zf-t/2+.1,dr});

    // Loot
    const put = (k, isW) => {
      const wd=WD[k], m = isW ? box(.2,.2,wd.len*.8,wd.c) : box(.45,.3,.45,wd.c);
      const px = bx+(R()-.5)*(w-3), pz = bz+(R()-.5)*(d-3);
      m.position.set(px, getTerrainHeight(px,pz) + (isW?.7:.4), pz);
      if(isW) m.rotation.y = R()*3; sc.add(m); loot.push({m, t:isW?'w':'a', k, dead:false});
    };
    const pick = () => WK[(R()*4)|0];
    
    if(isCastle){
      put('ar',1); put('sniper',1); put('smg',1); put('pistol',1);
      for(let j=0;j<6;j++) put(pick(),0);
      for(let j=0;j<3;j++){
        const mk=box(.5,.4,.5,0x10b981); mk.position.set(bx+(R()-.5)*10, th+.3, bz+(R()-.5)*10); sc.add(mk); loot.push({m:mk,t:'m',dead:false});
      }
    } else {
      const kd=R();
      if(kd<.3){for(let j=0,q=2+(R()*3|0);j<q;j++)put(pick(),0)}
      else if(kd<.6){for(let j=0,q=1+(R()*2|0);j<q;j++)put(pick(),1)}
      else{put(pick(),1);for(let j=0,q=1+(R()*3|0);j<q;j++)put(pick(),0)}
      if(R()<.35){const mk=box(.5,.4,.5,0x10b981); const px=bx+(R()<.5?-2:2), pz=zf+1.5; mk.position.set(px, getTerrainHeight(px,pz)+.3, pz); sc.add(mk); loot.push({m:mk,t:'m',dead:false})}
    }
  }
});

/* ================== CHARACTER & BOTS ================== */
function char(jc){
  const g=new THREE.Group(), p=[]; g.rotation.order='YXZ';
  const mk=(w,h,d,c,x,y,z,par)=>{const m=box(w,h,d,c); m.position.set(x,y,z); (par||g).add(m); p.push(m); return m};
  const pv=(x,y)=>{const o=new THREE.Group(); o.position.set(x,y,0); g.add(o); return o};
  const L=pv(-.16,.9), R2=pv(.16,.9); mk(.24,.9,.28,0x1e293b,0,-.45,0,L); mk(.24,.9,.28,0x1e293b,0,-.45,0,R2);
  const T=pv(0,0); mk(.75,.8,.42,jc,0,1.3,0,T); mk(.38,.38,.38,0xfde047,0,1.9,0,T); mk(.4,.14,.4,0x0f172a,0,2.12,0,T);
  const AL=pv(-.5,1.65), AR=pv(.5,1.65); mk(.2,.7,.2,jc,0,-.35,0,AL); mk(.2,.7,.2,jc,0,-.35,0,AR);
  const gun=mk(.12,.14,1,0x3b82f6,.1,1.3,-.55); return{g,p,L,R:R2,T,AL,AR,gun,ph:0}
}
function anim(c,sp,dt,aim,air){
  c.ph+=sp*dt*1.7; const k=Math.min(1,sp/5), s=Math.sin(c.ph), t=performance.now()/600;
  c.L.rotation.x=air?.7:s*.9*k; c.R.rotation.x=air?-.4:-s*.9*k;
  c.AL.rotation.x=aim?1.3:-s*.8*k+Math.sin(t)*.03; c.AR.rotation.x=aim?1.4:s*.8*k;
  c.AL.rotation.z=aim?.2:-.06; c.AR.rotation.z=aim?-.2:.06;
  c.T.position.y=Math.abs(s)*.08*k+Math.sin(t)*.012; c.T.rotation.z=s*.04*k;
}
const pc = char(0xdc2626); pc.gun.material=pc.gun.material.clone(); pc.gun.visible=false; sc.add(pc.g);
const pln = new THREE.Group(); {const f=box(2.5,2.5,14,0xb91c1c),w=box(18,.4,3,0x991b1b),t=box(5,.4,2,0x991b1b);t.position.z=6;pln.add(f,w,t);pln.scale.setScalar(1.5);sc.add(pln)}
const pch = new THREE.Mesh(new THREE.SphereGeometry(3.2,14,8,0,Math.PI*2,0,Math.PI/2),new THREE.MeshLambertMaterial({color:0x9333ea,side:THREE.DoubleSide}));sc.add(pch);

const zm = new THREE.Mesh(new THREE.CylinderGeometry(1,1,160,48,1,true),new THREE.MeshBasicMaterial({color:0xa855f7,transparent:true,opacity:0.3,side:THREE.DoubleSide,fog:false}));
zm.position.y = 80; sc.add(zm);

/* ================== STATE, ZONE, INVENTORY ================== */
let S='lobby', tm=0, alive=40, kills=0, best=0, yaw=0, pitch=.15, fireH=false, scope=false, ttm=0, nextDie=5;
try{best = +localStorage.getItem('brBestFinal')||0}catch(e){}

// 5-Stage Zone Logic
const zone = {x:0, z:0, r:1000, stage:1, cd:120, targetR:1000};
const zoneDamages = [0, 2, 4, 6, 8, 10];
const plane = {p:new V3(), d:new V3(), t:0, len:1};

const P = {
  pos:new V3(), vy:0, hp:200, rel:0, cd:0, crouch:false, dive:false, hit:0, cur:null,
  has:{}, res:{pistol:0, smg:0, ar:0, sniper:0, medkit:1}, kick:0, sp:0, inH:null, dn:null
};

let bots=[], tr=[];
const touch=matchMedia('(pointer:coarse)').matches;
function setS(s){S=s; document.body.dataset.s=s}
function inB(x,z,m){return blds.some(b=>Math.abs(x-b.x)<b.w/2+m&&Math.abs(z-b.z)<b.d/2+m)}
function toast(s){const e=$('tt'); e.textContent=s; e.style.opacity=1; ttm=2.5}

function init(){
  bots.forEach(b=>sc.remove(b.c.g)); bots=[];
  for(let i=0;i<39;i++){

const mapCtx = $('mapcanvas').getContext('2d');
function drawFullscreenMap(){
  const c = mapCtx, w = 460, h = 460;
  c.fillStyle = '#1e3a1e'; c.fillRect(0,0,w,h);
  
  // Grid
  c.strokeStyle = '#2d5a27'; c.lineWidth = 1;
  for(let i=0; i<w; i+=40){ c.beginPath(); c.moveTo(i,0); c.lineTo(i,h); c.stroke(); c.beginPath(); c.moveTo(0,i); c.lineTo(w,i); c.stroke(); }

  const scale = w / (HW*2), ox = w/2, oy = h/2;
  
  // Buildings
  c.fillStyle = '#8c6d53';
  blds.forEach(b => { c.fillRect((b.x - b.w/2)*scale + ox, (b.z - b.d/2)*scale + oy, b.w*scale, b.d*scale); });

  // Cities Text
  c.fillStyle = '#fff'; c.font = 'bold 12px Trebuchet MS'; c.textAlign = 'center';
  CITIES.forEach(ct => {
    const cx = ct.x*scale + ox, cz = ct.z*scale + oy;
    c.fillStyle = '#ffd23f'; c.fillRect(cx-3, cz-3, 6, 6);
    c.fillStyle = '#fff'; c.fillText(ct.name, cx, cz-8);
  });

  // Safe Zone
  c.strokeStyle = '#a855f7'; c.lineWidth = 2; c.beginPath();
  c.arc(zone.x*scale + ox, zone.z*scale + oy, zone.r*scale, 0, Math.PI*2); c.stroke();

  // Player
  c.fillStyle = '#38bdf8'; c.beginPath(); c.arc(P.pos.x*scale + ox, P.pos.z*scale + oy, 5, 0, Math.PI*2); c.fill();
}

const ray = new THREE.Raycaster(), ctr = new THREE.Vector2(0,0);
function shoot(){
  const w=cw(), h=P.has[P.cur]; h.mag--; P.cd=w.cd; P.kick=1;
  ray.setFromCamera(ctr, cam);
  ray.ray.direction.add(new V3((R()-.5)*w.sp, (R()-.5)*w.sp, (R()-.5)*w.sp)).normalize();
  
  const tg=[]; bots.forEach(b=>{if(b.hp>0) tg.push(...b.c.p)});
  glassPanes.forEach(gp=>{if(!gp.dead) tg.push(gp.m)});
  
  const hs = ray.intersectObjects(tg.concat(solids), false);
  let end = ray.ray.at(120, new V3()), hb = null, hitGlass = null;
  
  if(hs.length){
    end = hs[0].point.clone();
    hb = hs[0].object.userData.b || null;
    hitGlass = glassPanes.find(gp => gp.m === hs[0].object);
  }
  
  // Pecahkan kaca
  if(hitGlass && !hitGlass.dead){
    hitGlass.hp -= w.dmg;
    if(hitGlass.hp <= 0){ hitGlass.dead=true; hitGlass.m.visible=false; toast('Kaca Jendela Pecah! 💥'); }
  }

  // Aim assist (mobile)
  if(!hb && touch){
    let bd=.07; const dist=hs.length?hs[0].distance:120;
    for(const b of bots){
      if(b.hp<=0)continue; const c=b.c.g.position.clone(); c.y+=1.2;
      const v=c.clone().sub(cam.position), L=v.length();
      if(L<dist && L<70 && v.angleTo(ray.ray.direction)<bd){ bd=v.angleTo(ray.ray.direction); hb=b; end=c; }
    }
  }
  
  if(hb){
    hb.hp -= w.dmg;
    if(hb.hp <= 0){hb.dt=1.2; kills++; alive--; toast('Eliminasi! Kill: '+kills)}
  }
  
  const f = ray.ray.direction, mz = P.pos.clone(); mz.y+=1.4; mz.addScaledVector(f,.9); tracer(mz,end);
  pitch = Math.min(.85, pitch+.004+w.dmg*.00005);
  if(h.mag===0) rl();
  updateBagUI();
}

/* ================== UPDATE LOOP ================== */
function move(dt, spd){
  let ix=ji.x, iy=ji.y;
  if(keys.a||keys.arrowleft) ix-=1; if(keys.d||keys.arrowright) ix+=1; if(keys.w||keys.arrowup) iy+=1; if(keys.s||keys.arrowdown) iy-=1;
  const l = Math.hypot(ix,iy); if(l>1){ix/=l; iy/=l}
  const fx=-Math.sin(yaw), fz=-Math.cos(yaw), rx=Math.cos(yaw), rz=-Math.sin(yaw);
  P.pos.x += (fx*iy + rx*ix)*spd*dt; P.pos.z += (fz*iy + rz*ix)*spd*dt;
}

const cr = new THREE.Raycaster();
function camUpd(){
  const f=new V3(-Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw)*Math.cos(pitch)), r=new V3(Math.cos(yaw),0,-Math.sin(yaw));
  const t = P.pos.clone(); t.y += P.crouch?1.2:1.6; const d=scope?2.2:4.2;
  cam.position.copy(t).addScaledVector(f,-d).addScaledVector(r, scope?.5:.8);
  
  const th = getTerrainHeight(cam.position.x, cam.position.z);
  if(cam.position.y < th+.5) cam.position.y = th+.5;
  
  if(P.inH){
    const dir=cam.position.clone().sub(t), L=dir.length(); cr.set(t, dir.normalize()); cr.far=L;
    const hh=cr.intersectObjects(P.inH.sol, false);
    if(hh.length) cam.position.copy(t).addScaledVector(dir, Math.max(.4, hh[0].distance-.3));
  }
  cam.lookAt(cam.position.clone().add(f));
  const fv = scope?(P.cur==='sniper'?20:36):65; cam.fov+=(fv-cam.fov)*.2; cam.updateProjectionMatrix();
}

function update(dt){
  if(ttm>0){ttm-=dt; if(ttm<=0)$('tt').style.opacity=0}
  for(let i=tr.length-1; i>=0; i--){tr[i].t-=dt; if(tr[i].t<=0){sc.remove(tr[i].l); tr[i].l.geometry.dispose(); tr.splice(i,1)}}
  for(const d of doors){d.a+=((d.o?1:0)-d.a)*Math.min(1, dt*8); d.pv.rotation.y=-d.a*1.6}
  
  zm.visible = S==='play'||S==='drop'; pln.visible = S==='plane'||S==='drop'; pch.visible=false;

  if(S==='lobby'){
    const t=performance.now()/1000; pc.g.position.set(0, getTerrainHeight(0,0), 0); pc.g.rotation.y=.5+Math.sin(t*.5)*.3; pc.g.scale.set(1,1,1); anim(pc,0,dt,false,false);
    cam.position.set(2, getTerrainHeight(0,0)+2, 5); cam.lookAt(0, getTerrainHeight(0,0)+1.2, 0); cam.fov=55; cam.updateProjectionMatrix(); bots.forEach(b=>b.c.g.visible=false); return;
  }

  if(S==='plane'||S==='drop'){plane.t+=45*dt; plane.p.addScaledVector(plane.d, 45*dt); pln.position.copy(plane.p); pln.rotation.y=Math.atan2(-plane.d.x,-plane.d.z)}
  
  if(S==='plane'){
    P.pos.copy(plane.p); if(plane.t > plane.len-60) jump();
    const f = plane.d; cam.position.set(plane.p.x-f.x*36, plane.p.y+15, plane.p.z-f.z*36); cam.lookAt(plane.p); cam.fov=65; cam.updateProjectionMatrix(); pc.g.visible=false;
  }
  
  if(S==='drop'){
    pc.g.visible=true; move(dt, P.dive?9:14); P.pos.y -= (P.dive?35:10)*dt;
    const th = getTerrainHeight(P.pos.x, P.pos.z);
    pch.visible = !P.dive && P.pos.y > th+3;
    if(P.pos.y <= th){P.pos.y=th; P.vy=0; setS('play'); tm=0; toast('Mendarat! Cepat cari senjata & tas inventaris')}
  }

  if(S==='play'){
    tm+=dt; const px=P.pos.x, pz=P.pos.z;
    move(dt, P.crouch?3.4:6.8);
    
    const th = getTerrainHeight(P.pos.x, P.pos.z);
    P.vy -= 24*dt; P.pos.y += P.vy*dt;
    if(P.pos.y <= th){P.pos.y=th; P.vy=0}
    if(keys[' '] && Math.abs(P.pos.y-th)<.1) P.vy=8;

    col(P.pos, .5); P.sp = Math.hypot(P.pos.x-px, P.pos.z-pz)/dt; P.cd-=dt; P.hit-=dt; P.kick=Math.max(0, P.kick-dt*8);

    const w=cw();
    if(w&&P.rel>0){P.rel-=dt; if(P.rel<=0){const h=P.has[P.cur], n=Math.min(w.mag-h.mag, P.res[P.cur]); h.mag+=n; P.res[P.cur]-=n; updateBagUI();}}
    if(w&&fireH&&P.rel<=0&&P.cd<=0&&P.has[P.cur].mag>0) shoot();

    // Looting system (masuk tas otomatis)
    for(const l of loot){
      if(l.dead || Math.hypot(l.m.position.x-P.pos.x, l.m.position.z-P.pos.z)>1.8) continue;
      if(l.t==='w'){
        const isNew = !P.has[l.k];
        P.has[l.k] = {mag:WD[l.k].mag};
        toast('Mendapatkan: '+WD[l.k].n+' (Cek Tas)');
        if(!P.cur || isNew) eq(l.k);
      } else if(l.t==='a'){
        const am = WD[l.k].am; P.res[l.k]+=am; toast('Amunisi '+WD[l.k].n+' +'+am);
      } else {
        P.res.medkit++; toast('Medkit tersimpan di tas! (+1)');
      }
      l.dead=true; l.m.visible=false; updateBagUI();
    }

    let dn=null, dq=2.8; for(const d of doors){const q=Math.hypot(d.x-P.pos.x, d.z-P.pos.z); if(q<dq){dq=q; dn=d}} P.dn=dn; $('use').classList.toggle('hid',!dn); if(dn)$('use').textContent=dn.o?'TUTUP':'BUKA';

    // SISTEM ZONA 5 TAHAP
    zone.cd -= dt;
    if(zone.cd <= 0 && zone.stage < 5){
      zone.stage++;
      zone.targetR = Math.max(50, zone.r - 200);
      zone.cd = 120; // 120 detik (2 menit) cooldown
      toast('Zona Tahap '+zone.stage+' Menyusut! Hindari area luar zona.');
    }
    if(zone.r > zone.targetR) zone.r = Math.max(zone.targetR, zone.r - 10*dt);

    // Damage Zona
    const zDist = Math.hypot(P.pos.x-zone.x, P.pos.z-zone.z);
    if(zDist > zone.r){
      const dmgRate = zoneDamages[zone.stage] || 10;
      hurt(dmgRate * dt);
      if(ttm<=0) toast('Bahaya! Kamu di luar Zona Aman (Tahap '+zone.stage+')');
    }

    // Bot AI
    for(const b of bots){
      const p=b.c.g.position;
      if(b.hp<=0){if(b.dt>0){b.dt-=dt; b.c.g.rotation.x=Math.max(0,Math.min(1.5,(1.2-b.dt)*4)); if(b.dt<=0)b.c.g.visible=false}continue}
      
      const dx=P.pos.x-p.x, dz=P.pos.z-p.z, d=Math.hypot(dx,dz); let sp=0;
      const bTh = getTerrainHeight(p.x, p.z); p.y = bTh; // Bot ikutin daratan

      if(d<65){
        b.c.g.rotation.y = Math.atan2(-dx,-dz);
        if(d>16){p.x+=dx/d*3.4*dt; p.z+=dz/d*3.4*dt; sp=3.4}
        b.cd-=dt; if(b.cd<=0){b.cd=1+R(); const a=p.clone(); a.y+=1.4; const z=P.pos.clone(); z.y+=1.2; tracer(a,z); if(R()<.4)hurt(8)}
      } else {
        if(Math.hypot(p.x-zone.x, p.z-zone.z) > zone.r){b.wx=zone.x; b.wz=zone.z}
        else{b.wt-=dt; if(b.wt<=0){b.wx=p.x+(R()-.5)*90; b.wz=p.z+(R()-.5)*90; b.wt=4+R()*4}}
        const ax=b.wx-p.x, az=b.wz-p.z, l=Math.hypot(ax,az)||1;
        b.c.g.rotation.y = Math.atan2(-ax,-az); p.x+=ax/l*3*dt; p.z+=az/l*3*dt; sp=3;
      }
      col(p, .5); anim(b.c, sp*1.6, dt, d<65, false);
    }

    nextDie-=dt; if(nextDie<=0 && alive>2){
      const c = bots.filter(b=>b.hp>0 && Math.hypot(b.c.g.position.x-P.pos.x, b.c.g.position.z-P.pos.z)>130);
      if(c.length){const b = c[(R()*c.length)|0]; b.hp=0; b.c.g.visible=false; alive--} nextDie = 3+R()*4;
    }

    if(P.hp<=0) endG(false); else if(alive<=1) endG(true);
  }

  // Visual Update
  if(S==='drop'||S==='play'||S==='over'){
    const g=pc.g; g.visible=true; g.position.copy(P.pos); g.rotation.y=yaw;
    g.rotation.x = S==='drop'&&P.dive?-1.2:0; g.scale.set(1, P.crouch?.75:1, 1);
    
    if(S==='drop'){anim(pc,0,dt,false,false); pc.AL.rotation.z=-1.5; pc.AR.rotation.z=1.5; pc.AL.rotation.x=pc.AR.rotation.x=0; pc.L.rotation.x=.3; pc.R.rotation.x=-.3}
    else anim(pc, P.sp, dt, !!P.cur, P.pos.y > getTerrainHeight(P.pos.x, P.pos.z)+.1);

    pc.gun.position.z = -.25 - (P.cur?WD[P.cur].len*.4:.5) + P.kick*.2;
    pch.position.set(P.pos.x, P.pos.y+3.5, P.pos.z);
    
    const hI = inH(P.pos.x, P.pos.z); if(hI!==P.inH){blds.forEach(b=>b.roof.visible=true); if(hI)hI.roof.visible=false; P.inH=hI}
    if(S!=='over') camUpd();
  }

  zm.position.x=zone.x; zm.position.z=zone.z; zm.scale.set(zone.r,1,zone.r);

  // HUD
  $('al').textContent='👤 '+alive; $('kl').textContent='☠ '+kills;
  $('zn').textContent = `ZONA ${zone.stage}: ${zoneDamages[zone.stage]} DMG/s (${Math.ceil(zone.cd)}s)`;
  
  const w=cw();
  $('mg').textContent = w ? P.has[P.cur].mag+'/'+P.res[P.cur] : '—';
  $('rt').textContent = w ? (P.rel>0?'Reload':w.n) : 'Tas Kosong';
  
  $('hpb').style.width = Math.max(0, P.hp/2)+'%';
  $('hpb').style.background = P.hp<70?'#ef4444':'#22c55e';
  $('hpt').textContent = 'HP '+Math.max(0, P.hp|0)+'/200';
  
  mini();
}

/* ================== MINIMAP HUD ================== */
const mg = $('mm').getContext('2d');
function mini(){
  const s=.38, c=mg; c.fillStyle='#4f7a3c'; c.fillRect(0,0,130,130); c.save(); c.translate(65,65);
  c.fillStyle='#8c6d53'; for(const b of blds) c.fillRect((b.x-b.w/2-P.pos.x)*s, (b.z-b.d/2-P.pos.z)*s, b.w*s, b.d*s);
  
  c.strokeStyle='#a855f7'; c.lineWidth=2; c.beginPath(); c.arc((zone.x-P.pos.x)*s, (zone.z-P.pos.z)*s, zone.r*s, 0, 7); c.stroke();
  
  c.rotate(Math.atan2(-Math.cos(yaw),-Math.sin(yaw))); c.fillStyle='#38bdf8'; c.strokeStyle='#fff'; c.beginPath(); c.moveTo(8,0); c.lineTo(-5,-5); c.lineTo(-5,5); c.closePath(); c.fill(); c.stroke(); c.restore();
}

let last = performance.now();
(function loop(n){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (n-last)/1000); last=n;
  update(dt); rd.render(sc, cam);
})(last);
</script>
